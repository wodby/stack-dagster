name: dagster
title: Dagster
icon: dagster
docs: https://wodby.com/docs/2.0/stacks/catalog/dagster/

services:
  - name: dagster
    title: Dagster
    service: dagster
    required: true
    links:
    - name: postgres
      service: postgres
    # Loads the code location from the code service.
    configs:
    - name: workspace
      config: configs/workspace.yaml
    # Runs are executed inside the code server, which has the project's code
    # and packages, instead of in Kubernetes jobs.
    helm:
    - name: runLauncher.type
      value: CustomRunLauncher
    - name: runLauncher.config.customRunLauncher.module
      value: dagster
    - name: runLauncher.config.customRunLauncher.class
      value: DefaultRunLauncher
    # The chart's schema requires the launcher's own config.
    - name: runLauncher.config.customRunLauncher.config
      value: {}

  - name: code
    title: Dagster code location
    service: dagster-code
    required: true
    links:
    - name: postgres
      service: postgres

  - name: postgres
    title: PostgreSQL
    service: postgres
    required: true
