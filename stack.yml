name: dagster
title: Dagster
icon: dagster
docs: https://wodby.com/docs/2.0/stacks/catalog/dagster/
# The main stack of the Dagster variants: the catalog shows this next to the
# link to it on the variants' pages.
variantDescription: >-
  Choose this when your code locations run elsewhere: it runs Dagster's
  webserver and daemon only, and you add code locations to its workspace.

services:
  - name: dagster
    title: Dagster
    service: dagster
    required: true
    links:
    - name: postgres
      service: postgres

  - name: postgres
    title: PostgreSQL
    service: postgres
    required: true
